services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-tilik}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tilik_secret}
      POSTGRES_DB: ${DB_NAME:-tilik_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tilik} -d ${DB_NAME:-tilik_db}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
      target: development
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      PORT: 8080
      APP_ENV: ${APP_ENV:-development}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgres://${DB_USER:-tilik}:${DB_PASSWORD:-tilik_secret}@db:5432/${DB_NAME:-tilik_db}?sslmode=disable
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 10

  web:
    build:
      context: ./apps/web
      target: development
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8080}
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  web_node_modules:
  db_data:
